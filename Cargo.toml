[package]
name = "rustbolge"
version = "0.1.0"
edition = "2021"
description = "Classic Malbolge engine in Rust with snapshot/resume — the monster missing from GENEALOGIA_MALBOLGE"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
